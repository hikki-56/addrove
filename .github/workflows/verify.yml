name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          # ค่าปลอมสำหรับ CI เท่านั้น ต้องยาว ≥32 ตัวเพื่อผ่านการตรวจในขั้นที่ 1
          AUTH_SECRET: ci-only-not-a-real-secret-000000000000
          QR_TOKEN_SECRET: ci-only-not-a-real-qr-secret-00000000
          GOOGLE_SHEET_ID: ci-placeholder
